<!doctype html>
<!-- desolate's dashboard (section 4.8). Its own code only: no remote resource, no inline
     script, and nothing from a repository is ever put on this page as HTML. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desolate</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header>
  <h1>desolate</h1>
  <span id="stack" class="chip"></span>
  <span id="host" class="chip"></span>
  <span class="grow"></span>
  <a id="editor-defaults" class="button quiet small" target="_blank" rel="noopener noreferrer" hidden title="Every workspace's editor's default settings (theme, auto save, any setting), on the Mac's own page: an editor's own settings and the project's devcontainer override them">Editor defaults...</a>
</header>
<main>
  <section id="needs" hidden>
    <h2>Needs you</h2>
    <ul id="needs-list" class="rows"></ul>
  </section>
  <section id="issue" hidden></section>
  <section id="first-run" hidden></section>
  <section id="domains-section" class="foldable" data-fold-key="section:domains">
    <div class="section-head">
      <button type="button" class="fold" data-fold="section:domains" aria-label="hide or show the domains"></button>
      <h2>Domains</h2>
      <span id="domain-count" class="pill gray"></span>
      <span class="grow"></span>
      <input type="search" id="domain-filter" class="filter" placeholder="Filter: a domain or a repository" aria-label="filter the domains by name or repository">
      <button type="button" id="new-domain-open" class="quiet" title="A domain of your own: one or more repositories whose workspaces share secrets and network rules">New domain</button>
    </div>
    <div class="section-body">
      <div id="new-domain" hidden></div>
      <div id="domains"></div>
    </div>
  </section>
  <section id="activity" class="foldable" data-fold-key="section:activity" hidden>
    <div class="section-head">
      <button type="button" class="fold" data-fold="section:activity" aria-label="hide or show what the dashboard ran"></button>
      <h2>What the dashboard ran</h2>
      <span id="activity-count" class="pill gray"></span>
      <span class="grow"></span>
      <input type="search" id="activity-filter" class="filter" placeholder="Filter: a command" aria-label="filter what the dashboard ran by its command">
    </div>
    <div class="section-body">
      <ul id="activity-list" class="rows"></ul>
    </div>
  </section>
</main>
<!-- The review: a panel on the right, the window's height, as wide as the person drags it. -->
<aside id="review" hidden>
  <div class="resizer" title="Drag to make the review wider or narrower"></div>
  <div id="review-body"></div>
</aside>
<script src="/highlight.js"></script>
<script src="/markdown.js"></script>
<script src="/ui.js"></script>
</body>
</html>
